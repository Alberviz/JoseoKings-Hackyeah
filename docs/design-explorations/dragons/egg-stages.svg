<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-label="Egg to dragon stages">
  <rect width="480" height="160" fill="#f7f2ea"/>
  <!-- stage 1 egg -->
  <ellipse cx="60" cy="90" rx="28" ry="38" fill="#f0e6d8" stroke="#8a735a" stroke-width="3"/>
  <path d="M45 80 Q60 70 75 85" fill="none" stroke="#c4a882" stroke-width="2"/>
  <text x="60" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4a3a">Egg</text>
  <!-- stage 2 crack -->
  <ellipse cx="160" cy="90" rx="28" ry="38" fill="#f0e6d8" stroke="#8a735a" stroke-width="3"/>
  <path d="M148 70 L155 85 L150 95 L162 110" fill="none" stroke="#8a735a" stroke-width="2.5"/>
  <circle cx="168" cy="78" r="4" fill="#e8b89a"/>
  <text x="160" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4a3a">Crack</text>
  <!-- stage 3 hatch -->
  <ellipse cx="260" cy="105" rx="30" ry="18" fill="#f0e6d8" stroke="#8a735a" stroke-width="2.5"/>
  <circle cx="260" cy="72" r="26" fill="#e8b89a"/>
  <circle cx="252" cy="70" r="3" fill="#3a2f2a"/>
  <circle cx="268" cy="70" r="3" fill="#3a2f2a"/>
  <path d="M252 80 Q260 86 268 80" fill="none" stroke="#3a2f2a" stroke-width="2"/>
  <text x="260" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4a3a">Hatch</text>
  <!-- stage 4 young -->
  <ellipse cx="370" cy="100" rx="36" ry="28" fill="#e8b89a"/>
  <circle cx="370" cy="62" r="28" fill="#e8b89a"/>
  <ellipse cx="348" cy="48" rx="7" ry="12" fill="#d49a78"/>
  <ellipse cx="392" cy="48" rx="7" ry="12" fill="#d49a78"/>
  <circle cx="360" cy="62" r="4" fill="#3a2f2a"/>
  <circle cx="380" cy="62" r="4" fill="#3a2f2a"/>
  <path d="M360 74 Q370 82 380 74" fill="none" stroke="#3a2f2a" stroke-width="2"/>
  <path d="M330 95 Q318 80 332 72" fill="#c9ddd2"/>
  <path d="M410 95 Q422 80 408 72" fill="#c9ddd2"/>
  <text x="370" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4a3a">Young</text>
</svg>
