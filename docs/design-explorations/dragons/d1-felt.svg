  <!-- wings felt -->
  <path d="M48 110 Q28 90 46 78 Q58 96 62 112 Z" fill="#c9ddd2"/>
  <path d="M152 110 Q172 90 154 78 Q142 96 138 112 Z" fill="#c9ddd2"/>
  <!-- feet -->
